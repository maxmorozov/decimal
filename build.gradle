plugins {
    id 'java'
    id "me.champeau.jmh" version "0.7.3"
}

group = 'io.github.maxmorozov'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

jmh {
    jmhVersion = "1.37"
    includes = ["FPDecimal(Float|Double)Benchmark"]
    //includes = ["ClingerBenchmark"]
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.14.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

sourceSets {
    jmh
}

// Forcefully disable caching and incrementality for the JMH task.
tasks.named('jmh') {
    outputs.upToDateWhen { false }
}
